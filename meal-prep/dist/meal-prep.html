<style>
/* ===========================================================================
   Meal Prep — visual system

   The idea: a shelf-edge price ticket. That's the typography this app's reader
   looks at all day at work, and it's the right form for the content — the whole
   app resolves to a number you'll hand over at a till. So: heavy condensed
   numerals with the pence set small, hairline rules, uppercase micro-labels on
   a wide track, one accent and nothing else shouting.

   Type   Archivo Variable, one file carrying weight 100-900 AND width 62-125.
          The width axis does real work: numerals set condensed like a price
          label, micro-labels set expanded like the unit-price line under it.
   Colour Neutrals carry a slight green cast toward the accent rather than
          being flat grey. Deep grocer's green, never mint.
   Layout One 560px column, phone first. Summary before detail on every tab.
   =========================================================================== */

:root {
  color-scheme: light;

  --paper: #f2f5f2;
  --card: #ffffff;
  --card-2: #e9ede9;
  --ink: #101613;
  --ink-2: #57625b;
  --rule: #dbe1dc;

  --accent: #14663d;
  --accent-ink: #ffffff;
  --accent-wash: rgba(20, 102, 61, 0.10);

  /* Semantic, and deliberately not the accent: a flagged price and a blown
     budget must not read as "brand colour". */
  --flag: #8a5200;
  --flag-wash: rgba(138, 82, 0, 0.12);
  --over: #a52f1c;

  --shadow: 0 1px 2px rgba(16, 22, 19, 0.05), 0 4px 14px rgba(16, 22, 19, 0.05);
  --radius: 12px;
  --radius-sm: 9px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0d1110;
    --card: #161b18;
    --card-2: #1e2521;
    --ink: #e8ede9;
    --ink-2: #93a099;
    --rule: #29312c;
    --accent: #57cf95;
    --accent-ink: #05231a;
    --accent-wash: rgba(87, 207, 149, 0.14);
    --flag: #e2a94a;
    --flag-wash: rgba(226, 169, 74, 0.14);
    --over: #ef8b76;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0d1110;
  --card: #161b18;
  --card-2: #1e2521;
  --ink: #e8ede9;
  --ink-2: #93a099;
  --rule: #29312c;
  --accent: #57cf95;
  --accent-ink: #05231a;
  --accent-wash: rgba(87, 207, 149, 0.14);
  --flag: #e2a94a;
  --flag-wash: rgba(226, 169, 74, 0.14);
  --over: #ef8b76;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Archivo, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-variation-settings: "wght" 420, "wdth" 100;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { padding-bottom: env(safe-area-inset-bottom); }

#app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

button, input, select, textarea {
  font-family: inherit;
  font-variation-settings: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 5px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .btn:active, .meal-row:active { transform: none; }
}

/* ---------- Icons ---------------------------------------------------------
   One sprite, strokes on currentColor, so an icon is simply the colour and
   size of the text it sits beside. */

.ico {
  width: 1em;
  height: 1em;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: -0.135em;
}

.ico-lg { width: 1.25em; height: 1.25em; }
.ico-sm { width: 0.9em; height: 0.9em; stroke-width: 2; }

/* ---------- Typographic roles --------------------------------------------- */

/* The unit-price line on a shelf label: small, wide, spaced, quiet. Used for
   anything naming a number rather than being one. */
.micro {
  font-size: 0.625rem;
  font-variation-settings: "wght" 650, "wdth" 115;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-2);
  line-height: 1.2;
}

/* The price itself. Condensed and heavy, pence set small and raised the way a
   ticket sets them, figures tabular so columns of prices line up. */
.ticket {
  font-variation-settings: "wght" 800, "wdth" 88;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.025em;
  line-height: 1;
  white-space: nowrap;
}

.ticket .cur {
  font-size: 0.56em;
  font-variation-settings: "wght" 700, "wdth" 100;
  vertical-align: 0.62em;
  margin-right: 0.06em;
  letter-spacing: 0;
}

.ticket .pence {
  font-size: 0.62em;
  vertical-align: 0.34em;
  letter-spacing: -0.01em;
}

.ticket-xl { font-size: 2.7rem; }
.ticket-md { font-size: 1.05rem; }

.num { font-variant-numeric: tabular-nums; }

.section-title {
  font-size: 1.05rem;
  font-variation-settings: "wght" 700, "wdth" 96;
  letter-spacing: -0.01em;
  margin: 22px 0 10px;
}

/* ---------- Topbar --------------------------------------------------------- */

.topbar {
  padding: calc(env(safe-area-inset-top) + 18px) 18px 10px;
  position: sticky;
  top: 0;
  background: var(--paper);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 1.15rem;
  font-variation-settings: "wght" 700, "wdth" 94;
  letter-spacing: -0.015em;
}

.topbar .ico { color: var(--accent); }

#topbar-title {
  display: flex;
  align-items: center;
  gap: 9px;
}

.view-root {
  flex: 1;
  padding: 2px 18px 96px;
}

/* ---------- Week navigation ------------------------------------------------ */

.week-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 16px;
}

.week-range {
  font-size: 0.72rem;
  font-variation-settings: "wght" 650, "wdth" 112;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.nav-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--rule);
  background: var(--card);
  color: var(--ink-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  font-size: 0.9rem;
}

.nav-btn:active { background: var(--card-2); }

/* ---------- The headline ticket -------------------------------------------
   The one thing worth seeing first: what this week costs. */

.headline {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 18px 16px;
  margin-bottom: 12px;
}

.headline-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.headline .ticket-xl { color: var(--ink); }
.headline.over .ticket-xl { color: var(--over); }

.headline-aside {
  display: flex;
  gap: 18px;
  text-align: right;
}

.headline-aside .figure { display: block; }

.figure-value {
  font-size: 1.05rem;
  font-variation-settings: "wght" 750, "wdth" 92;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.015em;
  line-height: 1.1;
  display: block;
}

.figure-value.short { color: var(--over); }
.figure-value.met { color: var(--accent); }

.headline-rule {
  height: 1px;
  background: var(--rule);
  margin: 16px 0 14px;
}

.gauge + .gauge { margin-top: 12px; }

.gauge-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}

.gauge-value {
  font-size: 0.72rem;
  font-variation-settings: "wght" 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}

.meter {
  height: 5px;
  border-radius: 999px;
  background: var(--card-2);
  overflow: hidden;
}

.meter-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 240ms ease;
}

.meter-fill.over { background: var(--over); }

.headline-foot {
  margin-top: 14px;
  font-size: 0.75rem;
  color: var(--ink-2);
  line-height: 1.5;
}

/* ---------- Cards ---------------------------------------------------------- */

.card {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 12px;
}

.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.card-title {
  font-size: 0.95rem;
  font-variation-settings: "wght" 700, "wdth" 96;
  letter-spacing: -0.005em;
  display: flex;
  align-items: center;
  gap: 7px;
}

.card-sub {
  font-size: 0.72rem;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ---------- Day cards ------------------------------------------------------ */

.day-card {
  padding: 0;
  overflow: hidden;
  margin-bottom: 10px;
}

.day-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 16px;
  background: var(--card-2);
  border-bottom: 1px solid var(--rule);
}

.day-name {
  font-size: 0.68rem;
  font-variation-settings: "wght" 700, "wdth" 112;
  text-transform: uppercase;
  letter-spacing: 0.13em;
}

.day-date {
  font-size: 0.72rem;
  font-variation-settings: "wght" 550, "wdth" 104;
  letter-spacing: 0.04em;
  color: var(--ink-2);
  margin-left: 5px;
  font-variant-numeric: tabular-nums;
}

.cook-flag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 8px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--accent-wash);
  color: var(--accent);
  font-size: 0.58rem;
  font-variation-settings: "wght" 700, "wdth" 108;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.day-meta {
  font-size: 0.7rem;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.meal-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 16px;
  background: none;
  border: none;
  border-top: 1px solid var(--rule);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  font-size: 0.875rem;
  transition: background 120ms ease;
}

.day-card .meal-row:first-of-type { border-top: none; }
.meal-row:active { background: var(--card-2); }

.meal-row > .ico {
  color: var(--ink-2);
  font-size: 1.05rem;
}

.meal-main { flex: 1; min-width: 0; }

/* Both are spans inside the row, so they need to be told to stack — otherwise
   the sub-line runs on from the name and long names wrap raggedly around it. */
.meal-name {
  display: block;
  font-variation-settings: "wght" 560, "wdth" 100;
  letter-spacing: -0.005em;
}

.meal-name.empty {
  color: var(--ink-2);
  font-variation-settings: "wght" 420, "wdth" 100;
}

.meal-sub {
  display: block;
  font-size: 0.7rem;
  color: var(--ink-2);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.meal-sub .frozen {
  color: var(--flag);
  font-variation-settings: "wght" 650;
}

.meal-cost {
  font-variation-settings: "wght" 700, "wdth" 92;
  font-variant-numeric: tabular-nums;
  font-size: 0.85rem;
  white-space: nowrap;
  letter-spacing: -0.01em;
}

/* ---------- Shopping list -------------------------------------------------- */

.aisle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 22px 2px 8px;
}

.aisle .ico { color: var(--accent); font-size: 0.95rem; }

.aisle-line {
  flex: 1;
  height: 1px;
  background: var(--rule);
}

.shop-line {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  transition: opacity 140ms ease;
}

.shop-line.done { opacity: 0.4; }
.shop-line.done .shop-name { text-decoration: line-through; }

.tickbox {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  border: 1.5px solid var(--rule);
  background: var(--card);
  flex: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: transparent;
  padding: 0;
  font-size: 0.85rem;
  transition: background 120ms ease, border-color 120ms ease;
}

.tickbox.on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.shop-main { flex: 1; min-width: 0; cursor: pointer; }

.shop-name {
  font-variation-settings: "wght" 560, "wdth" 100;
  font-size: 0.875rem;
  letter-spacing: -0.005em;
}

.shop-sub {
  font-size: 0.7rem;
  color: var(--ink-2);
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
}

.qty-chip {
  font-variation-settings: "wght" 700, "wdth" 105;
  color: var(--ink);
  letter-spacing: 0.01em;
}

.shop-cost {
  font-variation-settings: "wght" 700, "wdth" 92;
  font-variant-numeric: tabular-nums;
  font-size: 0.9rem;
  white-space: nowrap;
  letter-spacing: -0.015em;
}

/* ---------- Badges --------------------------------------------------------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 0.56rem;
  font-variation-settings: "wght" 700, "wdth" 110;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  padding: 2px 6px;
  border-radius: 4px;
  vertical-align: 0.1em;
  margin-left: 6px;
  white-space: nowrap;
}

.badge.estimate { background: var(--flag-wash); color: var(--flag); }
.badge.confirmed { background: var(--accent-wash); color: var(--accent); }
.badge.batch { background: var(--accent-wash); color: var(--accent); }
.badge.fresh { background: var(--card-2); color: var(--ink-2); }

/* ---------- Running total -------------------------------------------------- */

.total-bar {
  position: sticky;
  bottom: calc(70px + env(safe-area-inset-bottom));
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: var(--radius);
  padding: 13px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 18px;
  box-shadow: var(--shadow);
  z-index: 4;
}

.total-bar .micro { color: var(--accent-ink); opacity: 0.72; margin-bottom: 3px; }
.total-bar .ticket { font-size: 1.5rem; }
.total-bar .side { text-align: right; }

/* ---------- Notices -------------------------------------------------------- */

.notice {
  display: flex;
  gap: 10px;
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 0.78rem;
  line-height: 1.55;
  margin-bottom: 12px;
  background: var(--card-2);
  color: var(--ink-2);
}

.notice .ico { color: var(--ink-2); margin-top: 0.15em; font-size: 0.95rem; }

.notice.warn {
  background: var(--flag-wash);
  color: var(--flag);
  font-variation-settings: "wght" 500;
}

.notice.warn .ico { color: var(--flag); }
.notice strong { font-variation-settings: "wght" 700; color: inherit; }

/* ---------- Buttons -------------------------------------------------------- */

.btn {
  border: 1px solid var(--rule);
  background: var(--card);
  color: var(--ink);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  font-size: 0.82rem;
  font-variation-settings: "wght" 620, "wdth" 100;
  letter-spacing: 0.005em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: transform 90ms ease, background 120ms ease;
}

.btn:active { transform: translateY(1px); }

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.btn.danger { color: var(--over); }
.btn.small { padding: 7px 11px; font-size: 0.74rem; }
.btn.block { width: 100%; }

.btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
.btn-row .btn { flex: 1; }

/* ---------- Forms ---------------------------------------------------------- */

.field { margin-bottom: 14px; }

.field label {
  display: block;
  font-size: 0.625rem;
  font-variation-settings: "wght" 650, "wdth" 115;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--ink-2);
  margin-bottom: 6px;
}

.field input, .field select, .field textarea {
  width: 100%;
  padding: 11px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  font-size: 1rem;
  font-variation-settings: "wght" 500, "wdth" 100;
}

.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
  outline: none;
}

.field-hint {
  font-size: 0.72rem;
  color: var(--ink-2);
  margin-top: 6px;
  line-height: 1.5;
}

.field-pair { display: flex; gap: 8px; }
.field-pair .field { flex: 1; }

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--rule);
}

.switch-row:last-child { border-bottom: none; }

.switch-label {
  font-size: 0.86rem;
  font-variation-settings: "wght" 560;
  display: flex;
  align-items: center;
  gap: 8px;
}

.switch-label .ico { color: var(--ink-2); }
.switch-sub { font-size: 0.7rem; color: var(--ink-2); margin-top: 2px; }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  border: 1px solid var(--rule);
  background: var(--card);
  color: var(--ink-2);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 0.74rem;
  font-variation-settings: "wght" 620, "wdth" 104;
  cursor: pointer;
  transition: background 120ms ease;
}

.chip.on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

/* ---------- Cook sessions -------------------------------------------------- */

.session-no {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 0.66rem;
  font-variation-settings: "wght" 750;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

.recipe-block { margin-bottom: 20px; }
.recipe-block:last-child { margin-bottom: 0; }

.recipe-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.recipe-name {
  font-size: 0.92rem;
  font-variation-settings: "wght" 680, "wdth" 96;
  letter-spacing: -0.008em;
}

.ing-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 0.8rem;
  padding: 5px 0;
}

.ing-line .leader {
  flex: 1;
  border-bottom: 1px dotted var(--rule);
  transform: translateY(-3px);
}

.ing-line .ing-amt {
  color: var(--ink-2);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  font-variation-settings: "wght" 600;
}

.cook-step {
  display: flex;
  gap: 10px;
  font-size: 0.82rem;
  line-height: 1.55;
  margin-bottom: 8px;
  color: var(--ink-2);
}

.cook-step .num {
  flex: none;
  width: 18px;
  font-size: 0.62rem;
  font-variation-settings: "wght" 700, "wdth" 110;
  color: var(--accent);
  margin-top: 0.35em;
  letter-spacing: 0.06em;
}

/* ---------- Modal ---------------------------------------------------------- */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(6, 10, 8, 0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 20;
  animation: fade 140ms ease;
}

.modal {
  background: var(--card);
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow-y: auto;
  border-radius: 18px 18px 0 0;
  padding: 10px 18px calc(20px + env(safe-area-inset-bottom));
  animation: rise 200ms cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(14px); } }

/* The grab handle says "this sheet came up and can go back down". */
.modal::before {
  content: "";
  display: block;
  width: 36px;
  height: 4px;
  border-radius: 999px;
  background: var(--rule);
  margin: 0 auto 14px;
}

.modal-title {
  font-size: 1.05rem;
  font-variation-settings: "wght" 720, "wdth" 96;
  letter-spacing: -0.012em;
  margin-bottom: 14px;
}

.option-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: border-color 120ms ease, background 120ms ease;
}

.option-row.on { border-color: var(--accent); background: var(--accent-wash); }
.option-main { flex: 1; min-width: 0; }

.option-name {
  font-size: 0.875rem;
  font-variation-settings: "wght" 580;
  letter-spacing: -0.005em;
}

.option-sub {
  font-size: 0.7rem;
  color: var(--ink-2);
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
}

/* ---------- Tab bar -------------------------------------------------------- */

.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 10;
}

.tab-btn {
  flex: 1;
  background: none;
  border: none;
  padding: 9px 2px 9px;
  color: var(--ink-2);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: color 140ms ease;
}

.tab-btn .ico { font-size: 1.2rem; stroke-width: 1.6; }
.tab-btn.active { color: var(--accent); }
.tab-btn.active .ico { stroke-width: 2.1; }

.tab-label {
  font-size: 0.58rem;
  font-variation-settings: "wght" 640, "wdth" 108;
  text-transform: uppercase;
  letter-spacing: 0.09em;
}

/* ---------- Toast ---------------------------------------------------------- */

.toast-root {
  position: fixed;

<script type="module">
// ---------- js/utils.js ----------
const __utils = (() => {
// Date, money and small DOM helpers shared across modules.

const DAY_KEYS = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
const DAY_LABELS = {
  monday: 'Monday', tuesday: 'Tuesday', wednesday: 'Wednesday', thursday: 'Thursday',
  friday: 'Friday', saturday: 'Saturday', sunday: 'Sunday',
};
const DAY_SHORT = {
  monday: 'Mon', tuesday: 'Tue', wednesday: 'Wed', thursday: 'Thu',
  friday: 'Fri', saturday: 'Sat', sunday: 'Sun',
};

const SLOT_KEYS = ['breakfast', 'lunch', 'dinner', 'snack', 'snack2'];
const SLOT_LABELS = {
  breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner',
  snack: 'Snack', snack2: 'Second snack',
};
// Icon names from the sprite in js/icons.js, not emoji: emoji can't take the
// theme's colour and render differently on every phone.
const SLOT_ICONS = {
  breakfast: 'sunrise', lunch: 'sandwich', dinner: 'utensils-crossed',
  snack: 'apple', snack2: 'cookie',
};

// Both snack slots eat from the same pool of snack recipes.
function baseSlot(slot) {
  return slot === 'snack2' ? 'snack' : slot;
}

// JS getDay(): 0=Sun..6=Sat. Our week starts Monday.
function dayKeyFor(date) {
  return DAY_KEYS[(date.getDay() + 6) % 7];
}

function isoDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function parseIsoDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function stripTime(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function startOfWeek(date) {
  const idx = (date.getDay() + 6) % 7; // 0=Mon
  return addDays(stripTime(date), -idx);
}

function formatWeekRange(weekStart) {
  const end = addDays(weekStart, 6);
  const sameMonth = weekStart.getMonth() === end.getMonth();
  const startStr = weekStart.toLocaleDateString(undefined, { day: 'numeric', month: sameMonth ? undefined : 'short' });
  const endStr = end.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  return `${startStr} – ${endStr}`;
}

// £4.5 -> "£4.50", £0.4 -> "£0.40". Keeps pence honest; the whole app is
// arithmetic on prices so rounding only ever happens at display time.
function money(n) {
  const v = Number.isFinite(n) ? n : 0;
  return `£${v.toFixed(2)}`;
}

// The same number set the way a shelf-edge ticket sets it: small raised sign,
// big pounds, small pence. Used wherever a price is the point rather than an
// aside — the headline total, the running total, the money you're deciding on.
function moneyTicket(n, cls = '') {
  const v = Number.isFinite(n) ? n : 0;
  const [pounds, pence] = Math.abs(v).toFixed(2).split('.');
  const sign = v < 0 ? '-' : '';
  return `<span class="ticket ${cls}"><span class="cur">£</span>${sign}${pounds}<span class="pence">.${pence}</span></span>`;
}

// Quantities read better without trailing noise: 87.5g -> "88g", 0.5 -> "½".
function qty(n, unit) {
  if (unit === 'unit') {
    const rounded = Math.round(n * 100) / 100;
    if (Math.abs(rounded - 0.5) < 0.01) return '½';
    if (Math.abs(rounded - 0.25) < 0.01) return '¼';
    return String(rounded % 1 === 0 ? rounded : rounded.toFixed(2).replace(/0$/, ''));
  }
  if (n >= 1000) return `${(n / 1000).toFixed(n % 1000 === 0 ? 0 : 2)}${unit === 'ml' ? 'L' : 'kg'}`;
  return `${Math.round(n)}${unit}`;
}

function unitNoun(ing, amount) {
  if (ing.unit !== 'unit') return '';
  const n = ing.unitNoun || 'x';
  return amount === 1 ? n : `${n}s`;
}

// "750g" for weighed things, "7 bananas" for things sold by the item.
function amountLabel(ing, amount) {
  if (!ing) return '';
  if (ing.unit === 'unit') return `${qty(amount, 'unit')} ${unitNoun(ing, amount)}`.trim();
  return qty(amount, ing.unit);
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function qs(sel, root = document) {
  return root.querySelector(sel);
}

function qsa(sel, root = document) {
  return Array.from(root.querySelectorAll(sel));
}

// Deterministic shuffle so "regenerate" gives a different plan each tap but the
// same plan if you reopen the app without regenerating.
function seededShuffle(arr, seed) {
  const out = arr.slice();
  let s = seed || 1;
  for (let i = out.length - 1; i > 0; i--) {
    s = (s * 1103515245 + 12345) % 2147483648;
    const j = Math.abs(s) % (i + 1);
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

return { baseSlot, dayKeyFor, isoDate, parseIsoDate, stripTime, addDays, startOfWeek, formatWeekRange, money, moneyTicket, qty, unitNoun, amountLabel, escapeHtml, clamp, uid, qs, qsa, seededShuffle, DAY_KEYS, DAY_LABELS, DAY_SHORT, SLOT_KEYS, SLOT_LABELS, SLOT_ICONS };
})();

const __costing = (() => {
// All the arithmetic: what a recipe costs, what a week needs, what you'll
// actually hand over at the till.
//
// Two different numbers matter and the app shows both, because they answer
// different questions:
//
//   Till total  — you can't buy 300g of a 500g pack. This rounds every
//                 ingredient up to whole packs. It's what leaves your bank.
//   Food used   — the value of what the week's meals actually eat. Lower than
//                 the till total, because the rest of the pack is still in your
//                 cupboard next week. This is the fair cost per meal.

// Price per gram / per ml / per unit.
function unitPrice(ing) {
  if (!ing || !ing.packQty) return 0;
  return ing.packPrice / ing.packQty;
}

function costOf(ing, amount) {
  return unitPrice(ing) * amount;
}

// Nutrition is per 100g/100ml for weighed items, per item for unit items.
function nutritionOf(ing, amount) {
  if (!ing) return { protein: 0, kcal: 0 };
  const factor = ing.unit === 'unit' ? amount : amount / 100;
  return { protein: (ing.protein || 0) * factor, kcal: (ing.kcal || 0) * factor };
}

// Per single portion.
function recipeStats(recipe, ingMap) {
  let cost = 0;
  let protein = 0;
  let kcal = 0;
  let missing = 0;
  for (const item of recipe.items) {
    const ing = ingMap.get(item.ingredient);
    if (!ing) { missing++; continue; }
    cost += costOf(ing, item.amount);
    const n = nutritionOf(ing, item.amount);
    protein += n.protein;
    kcal += n.kcal;
  }
  return { cost, protein, kcal, missing };
}

function proteinPerPound(recipe, ingMap) {
  const { cost, protein } = recipeStats(recipe, ingMap);
  if (cost <= 0) return protein > 0 ? Infinity : 0;
  return protein / cost;

function planMeals(plan, recipeMap) {
  const out = [];
  if (!plan || !plan.meals) return out;
  for (const dayKey of DAY_KEYS) {
    const day = plan.meals[dayKey];
    if (!day) continue;
    for (const slot of SLOT_KEYS) {
      const entry = day[slot];
      if (!entry || !entry.recipe) continue;
      const recipe = recipeMap.get(entry.recipe);
      if (!recipe) continue;
      out.push({ dayKey, slot, recipe, servings: entry.servings || 1 });
    }

function requirements(plan, recipeMap) {
  const req = new Map();

    for (const item of meal.recipe.items) {
      const amount = item.amount * meal.servings;
      req.set(item.ingredient, (req.get(item.ingredient) || 0) + amount);
    }
  }
  return req;

// off the total but stay visible so you can untick them when they run out.
function shoppingList(plan, recipeMap, ingMap, pantry = {}) {
  const req = requirements(plan, recipeMap);
  const lines = [];

  for (const [ingId, required] of req.entries()) {
    const ing = ingMap.get(ingId);
    if (!ing) continue;
    const have = !!pantry[ingId];
    const packs = have ? 0 : Math.ceil(required / ing.packQty - 1e-9);
    const packCost = packs * ing.packPrice;
    const usedCost = costOf(ing, required);
    lines.push({
      id: ingId,
      ing,
      required,
      packs,
      packCost,
      usedCost,
      leftover: Math.max(0, packs * ing.packQty - required),
      have,
      staple: !!ing.staple,
      estimate: !ing.confirmedAt,

    usedTotal += line.usedCost;

  // different plan when several are near enough equally good.
  let taste = 0;
  if (jitter) for (const id of ids) taste += jitter.get(id) || 0;

  // Variety is a tie-breaker, never something bought with protein: while the
  // plan is still short of target, a more interesting week that hits less
  // protein must not win.
  const variety = proteinGap <= 1 ? repeats * 0.6 - distinct * 0.15 : 0;

  return summary.usedTotal
    + overBudget * 8
    + proteinGap * 0.35
    + nonBatch * 0.12   // mild nudge towards things that actually batch-cook
    + variety
    + taste;
}

function generatePlan(state, seed = 1) {
  const { settings, recipes } = state;
  const ingMap = new Map(state.ingredients.map((i) => [i.id, i]));
  const recipeMap = new Map(recipes.map((r) => [r.id, r]));
  const blocks = cookBlocks(settings.cookDays);
  const positions = buildPositions(settings, blocks);

  const pools = {};
  for (const slot of SLOT_KEYS) {
    pools[slot] = candidatesFor(slot, recipes, ingMap);
  }

  const jitter = new Map(recipes.map((r, i) => [r.id, noise(seed, i) * 0.06]));

  // How many distinct mains a varied week would have, for the repeat penalty.
  const expected = {
    lunch: new Set(positions.filter((p) => p.kind === 'lunch').map((p) => p.key)).size,
    dinner: new Set(positions.filter((p) => p.kind === 'dinner').map((p) => p.key)).size,
  };

  const evaluate = (meals) => score(meals, state, recipeMap, ingMap, settings, expected, jitter);

  // A single hill-climb gets stuck wherever it started, and with a tight budget
  // the local optima are meaningfully far apart — so run several from different
  // starting points and keep the best. Each pass is a few milliseconds.
  let bestMeals = null;
  let bestScore = Infinity;

  for (let restart = 0; restart < RESTARTS; restart++) {
    const choice = openingGuess(positions, pools, ingMap, seed + restart * 101, restart);
    let current = assemble(choice, positions, settings, blocks);
    let best = evaluate(current);

    for (let pass = 0; pass < 30; pass++) {
      let improvedKey = null;
      let improvedId = null;
      let improvedScore = best;

      for (const pos of positions) {
        const original = choice[pos.key];
        const twin = samedayTwin(pos.key);
        const blocked = twin ? choice[twin] : null;
        for (const candidate of pools[pos.slot]) {
          if (candidate.id === original) continue;
          if (blocked && candidate.id === blocked) continue;
          choice[pos.key] = candidate.id;
          const s = evaluate(assemble(choice, positions, settings, blocks));
          if (s < improvedScore - 1e-9) {
            improvedScore = s;
            improvedKey = pos.key;
            improvedId = candidate.id;
          }
        }
        choice[pos.key] = original;
      }

      if (!improvedKey) break;
      choice[improvedKey] = improvedId;
      best = improvedScore;
      current = assemble(choice, positions, settings, blocks);
    }

    if (best < bestScore) {
      bestScore = best;
      bestMeals = current;
    }
  }

  return {
    meals: bestMeals || {},
    bought: {},
    seed,
    generatedAt: new Date().toISOString(),
  };
}

// Restart 0 starts from the best protein-per-pound in each slot — the sensible
// greedy answer. The rest start from shuffled picks so the climbs explore
// different corners.
function openingGuess(positions, pools, ingMap, seed, restart) {
  const choice = {};
  const used = new Set();

  for (const pos of positions) {
    const pool = pools[pos.slot];
    if (!pool || !pool.length) continue;

    let ranked;
    if (restart === 0) {
      ranked = pool.slice().sort((a, b) => {
        const sa = recipeStats(a, ingMap);
        const sb = recipeStats(b, ingMap);
        const pa = sa.cost > 0 ? sa.protein / sa.cost : 0;
        const pb = sb.cost > 0 ? sb.protein / sb.cost : 0;
        return pb - pa;
      });
    } else {
      ranked = seededShuffle(pool, seed + positions.indexOf(pos));
    }

    const fresh = ranked.find((r) => !used.has(r.id)) || ranked[0];
    choice[pos.key] = fresh.id;
    used.add(fresh.id);
  }

  return choice;
}

// What each cook session has to produce: recipe, how many portions, and which
// of those portions won't survive in the fridge that long.
function cookSessions(plan, state, recipeMap) {
  const blocks = cookBlocks(state.settings.cookDays);
  const sessions = [];

  for (const cookDay of blocks.order) {
    const days = blocks.blocks.get(cookDay);
    const byRecipe = new Map();

    for (const dayKey of days) {
      const day = (plan.meals || {})[dayKey] || {};
      for (const slot of SLOT_KEYS) {
        const entry = day[slot];
        if (!entry || !entry.recipe) continue;
        const recipe = recipeMap.get(entry.recipe);
        if (!recipe) continue;
        if (!byRecipe.has(recipe.id)) {
          byRecipe.set(recipe.id, { recipe, portions: 0, days: [], freezeAfter: null });
        }
        const agg = byRecipe.get(recipe.id);
        agg.portions += entry.servings || 1;
        agg.days.push({ dayKey, slot, age: daysAfterCook(cookDay, dayKey) });
      }
    }

    for (const agg of byRecipe.values()) {
      agg.days.sort((a, b) => a.age - b.age);
      if (agg.recipe.keeps > 0) {
        const beyond = agg.days.filter((d) => d.age > agg.recipe.keeps);
        agg.freezeAfter = beyond.length ? beyond : null;
      }
    }

    // Batch first — that's the order you'd actually cook in.
    const items = Array.from(byRecipe.values()).sort((a, b) => {
      if (a.recipe.mode !== b.recipe.mode) return a.recipe.mode === 'batch' ? -1 : 1;
      return b.portions - a.portions;
    });

    sessions.push({
      cookDay,
      days,
      items,
      batchMinutes: items.filter((i) => i.recipe.mode === 'batch').reduce((m, i) => m + i.recipe.minutes, 0),
    });
  }

  // Cooking on Sunday feeds Monday, so order sessions by the first day they
  // actually feed rather than by where the cook day falls in the week.
  sessions.sort((a, b) => {
    const first = (s) => Math.min(...s.days.map((d) => DAY_KEYS.indexOf(d)));
    return first(a) - first(b);
  });

  return sessions;
}

return { cookBlocks, daysAfterCook, generatePlan, cookSessions };
})();

// Ranked name search: exact prefix beats word-start beats anywhere, so typing
// "chick" puts chicken breast above "chickpeas, tinned".
function searchFoods(query, limit = 30) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return FOOD_TABLE.slice(0, limit);

  const scored = [];
  for (const food of FOOD_TABLE) {
    const name = food.name.toLowerCase();
    let score;
    if (name === q) score = 0;
    else if (name.startsWith(q)) score = 1;
    else if (new RegExp(`\\b${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`).test(name)) score = 2;
    else if (name.includes(q)) score = 3;
    else continue;
    scored.push({ food, score });
  }

  scored.sort((a, b) => (a.score - b.score) || a.food.name.localeCompare(b.food.name));
  return scored.slice(0, limit).map((s) => s.food);
}

return { searchFoods, FOOD_TABLE };
})();

const __barcode = (() => {
// Barcode lookup against Open Food Facts — a free, open, no-key database of
// packaged food. It gives the product name, pack size and nutrition. It does
// NOT give prices: no public database has UK shop prices, so the price is
// always yours to type.
//
// A caution worth keeping in the code: this parser was written without being
// able to call the live API (the machine it was built on couldn't reach it), so
// every field is read defensively — several possible key names, types checked,
// anything unreadable left null for you to fill rather than guessed at. If the
// response shape ever changes, this degrades to "couldn't read that" instead of
// writing nonsense into your price list.

const API = 'https://world.openfoodfacts.org/api/v2/product';
const FIELDS = [
  'code', 'product_name', 'product_name_en', 'generic_name', 'brands',
  'quantity', 'product_quantity', 'product_quantity_unit', 'nutriments',
].join(',');

const TIMEOUT_MS = 10000;

class LookupError extends Error {
  constructor(message, kind) {
    super(message);
    this.kind = kind; // 'offline' | 'blocked' | 'notfound' | 'unreadable'
  }
}

// Live camera scanning needs the browser's own barcode reader. Chrome and
// Android have it; Safari doesn't, and there it falls back to typing the digits.
function canScanWithCamera() {
  return typeof window !== 'undefined'
    && 'BarcodeDetector' in window
    && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    && window.isSecureContext;
}

// "1kg" -> 1000g. "6 x 45g" -> 270g. "75cl" -> 750ml. Null when there's no
// quantity to be found, which is common on loose or badly-catalogued products.
function parseQuantity(text) {
  if (!text) return null;
  const s = String(text).toLowerCase().replace(/,/g, '.');

  const toBase = (value, unit) => {
    if (!Number.isFinite(value) || value <= 0) return null;
    switch (unit) {
      case 'kg': return { qty: value * 1000, unit: 'g' };
      case 'g': return { qty: value, unit: 'g' };
      case 'l': return { qty: value * 1000, unit: 'ml' };
      case 'cl': return { qty: value * 10, unit: 'ml' };
      case 'ml': return { qty: value, unit: 'ml' };
      default: return null;
    }
  };

  // Multipacks first — "4 x 125g" is 500g, not 4g and not 125g.
  const multi = s.match(/(\d+(?:\.\d+)?)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(kg|g|ml|cl|l)\b/);
  if (multi) {
    const base = toBase(Number(multi[2]), multi[3]);
    if (base) return { qty: base.qty * Number(multi[1]), unit: base.unit };
  }

  const single = s.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|cl|l)\b/);
  if (single) return toBase(Number(single[1]), single[2]);

  return null;
}

function firstNumber(source, keys) {
  if (!source || typeof source !== 'object') return null;
  for (const key of keys) {
    const value = source[key];
    const n = typeof value === 'string' ? Number(value) : value;
    if (typeof n === 'number' && Number.isFinite(n) && n >= 0) return n;
  }
  return null;
}

function firstString(source, keys) {
  if (!source || typeof source !== 'object') return '';
  for (const key of keys) {
    const value = source[key];
    if (typeof value === 'string' && value.trim()) return value.trim();
  }
  return '';
}

// Turns whatever the API returned into the fields the price editor needs.
// Anything it can't read confidently comes back null.
function parseProduct(product) {
  if (!product || typeof product !== 'object') return null;

  const name = firstString(product, ['product_name_en', 'product_name', 'generic_name']);
  const brand = firstString(product, ['brands']).split(',')[0].trim();
  const n = product.nutriments;

  const protein = firstNumber(n, ['proteins_100g', 'proteins_value', 'proteins']);

  let kcal = firstNumber(n, ['energy-kcal_100g', 'energy-kcal_value', 'energy-kcal']);
  if (kcal == null) {
    // Some products carry only kilojoules.
    const kj = firstNumber(n, ['energy_100g', 'energy-kj_100g', 'energy_value']);
    if (kj != null) kcal = kj / 4.184;
  }

  // Prefer the numeric quantity when the API gives one, fall back to parsing
  // the human-written "quantity" string.
  let pack = null;
  const numericQty = firstNumber(product, ['product_quantity']);
  const numericUnit = firstString(product, ['product_quantity_unit']).toLowerCase();
  if (numericQty != null && numericQty > 0) {
    const converted = parseQuantity(`${numericQty}${numericUnit || 'g'}`);
    if (converted) pack = converted;
  }
  if (!pack) pack = parseQuantity(product.quantity);

  const label = [name, brand && brand !== name ? `(${brand})` : ''].filter(Boolean).join(' ');
  if (!label && protein == null && !pack) return null;

  return {
    name: label || '',
    packQty: pack ? Math.round(pack.qty) : null,
    unit: pack ? pack.unit : null,
    protein: protein == null ? null : Math.round(protein * 10) / 10,
    kcal: kcal == null ? null : Math.round(kcal),
  };
}

// Barcodes are 8–14 digits; anything else is a typo, not a lookup.
function normaliseBarcode(input) {
  const digits = String(input || '').replace(/\D/g, '');
  return digits.length >= 8 && digits.length <= 14 ? digits : null;
}

async function lookupBarcode(input, fetchImpl = fetch) {
  const code = normaliseBarcode(input);
  if (!code) throw new LookupError('That does not look like a barcode — they are 8 to 14 digits.', 'unreadable');

  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    throw new LookupError('No connection, so the food database is out of reach. Type the details in instead.', 'offline');
  }

  const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = controller ? setTimeout(() => controller.abort(), TIMEOUT_MS) : null;

  let response;
  try {
    response = await fetchImpl(`${API}/${code}.json?fields=${FIELDS}`, {
      signal: controller ? controller.signal : undefined,
      headers: { Accept: 'application/json' },
    });
  } catch (e) {
    throw new LookupError(
      'Could not reach the food database. Barcode lookup needs a connection, and it does not work inside Claude — outside requests are blocked there.',
      'blocked'
    );
  } finally {
    if (timer) clearTimeout(timer);
  }

  if (!response || !response.ok) {
    throw new LookupError('The food database did not answer. Try again, or type the details in.', 'blocked');
  }

  let body;
  try {
    body = await response.json();
  } catch (e) {
    throw new LookupError('The food database sent something unreadable.', 'unreadable');
  }

  const found = body && (body.status === 1 || body.status === 'success' || body.product);
  if (!found) {
    throw new LookupError('No product with that barcode. Type the details in yourself.', 'notfound');
  }

  const parsed = parseProduct(body.product);
  if (!parsed) {
    throw new LookupError('That product is in the database but has nothing useful recorded.', 'unreadable');
  }

  return { ...parsed, code };
}

return { canScanWithCamera, parseQuantity, parseProduct, normaliseBarcode, lookupBarcode, LookupError };
})();

         ${settings.proteinTarget}g of protein a day, then tells you exactly what

      <button class="btn primary block" data-action="generate">Build this week's plan</button>
    `;
  }

  const budget = settings.budget || 0;
  const over = budget && summary.tillTotal > budget;
  const budgetPct = budget ? clamp((summary.tillTotal / budget) * 100, 0, 100) : 0;
  const proteinPct = settings.proteinTarget
    ? clamp((summary.avgProtein / settings.proteinTarget) * 100, 0, 100)
    : 0;
  // A couple of grams either side of target isn't worth flagging.
  const short = settings.proteinTarget && summary.avgProtein < settings.proteinTarget - 5;

  const blocks = cookBlocks(settings.cookDays);

  return `
    ${weekNav(weekStart)}
    ${storageWarning()}

    <div class="headline ${over ? 'over' : ''}">
      <div class="headline-top">
        <div>
          <div class="micro">Till total</div>
          <div style="margin-top:7px">${moneyTicket(summary.tillTotal, 'ticket-xl')}</div>
        </div>
        <div class="headline-aside">
          <span class="figure">
            <span class="micro">Per meal</span>
            <span class="figure-value">${money(summary.costPerMeal)}</span>
          </span>
          <span class="figure">
            <span class="micro">Protein</span>
            <span class="figure-value ${short ? 'short' : 'met'}">${Math.round(summary.avgProtein)}g</span>
          </span>
        </div>
      </div>

      <div class="headline-rule"></div>

      <div class="gauge">
        <div class="gauge-head">
          <span class="micro">Budget</span>
          <span class="gauge-value">${money(summary.tillTotal)} of ${money(budget)}</span>
        </div>
        <div class="meter"><div class="meter-fill ${over ? 'over' : ''}" style="width:${budgetPct}%"></div></div>
      </div>
      <div class="gauge">
        <div class="gauge-head">
          <span class="micro">Protein a day</span>
          <span class="gauge-value">${Math.round(summary.avgProtein)}g of ${settings.proteinTarget}g</span>
        </div>
        <div class="meter"><div class="meter-fill ${short ? 'over' : ''}" style="width:${proteinPct}%"></div></div>
      </div>

      <div class="headline-foot">
        ${summary.mealCount} meals · ${Math.round(summary.avgKcal).toLocaleString()} kcal a day ·
        ${money(summary.usedTotal)} of food actually eaten, ${money(summary.leftoverValue)} left
        in the cupboard for next week.
      </div>
    </div>

    ${short && plan.generatedAt ? notice(`This is the best it could do: nothing in the
      recipe list reaches ${settings.proteinTarget}g a day while staying inside
      ${money(budget)}. It's short by ${Math.round(settings.proteinTarget - summary.avgProtein)}g.
      Raise the budget, turn on a second snack, or add a high-protein recipe of your
      own — all on the <strong>More</strong> tab.`) : ''}

    ${summary.estimatedLines > 0 ? notice(`${summary.estimatedLines}
      price${summary.estimatedLines === 1 ? '' : 's'} on this list
      ${summary.estimatedLines === 1 ? 'is' : 'are'} still an estimate. Look them up in
      Inform as you shop and correct them on the <strong>Prices</strong> tab — the total
      is only as good as those numbers.`, 'warn') : ''}

    <div class="btn-row">
      <button class="btn" data-action="generate">${icon('refresh-cw')} Regenerate</button>
      <button class="btn" data-action="clear-week">${icon('trash-2')} Clear week</button>
    </div>

    ${DAY_KEYS.map((dayKey, i) => dayCard(dayKey, addDays(weekStart, i), ctx, blocks)).join('')}
  `;
}

function dayCard(dayKey, date, ctx, blocks) {
  const { plan, state, ingMap, recipeMap } = ctx;
  const day = (plan.meals || {})[dayKey] || {};
  const totals = ctx.summary.perDay[dayKey] || { protein: 0, cost: 0 };
  const cookDay = blocks.dayToBlock[dayKey];
  const isCookDay = state.settings.cookDays.includes(dayKey);

  const rows = SLOT_KEYS.filter((slot) => state.settings.slots[slot]).map((slot) => {
    const entry = day[slot];
    const recipe = entry ? recipeMap.get(entry.recipe) : null;

    if (!recipe) {
      return `
        <button class="meal-row" data-action="pick-meal" data-day="${dayKey}" data-slot="${slot}">
          ${icon(SLOT_ICONS[slot])}
          <span class="meal-main"><span class="meal-name empty">Add ${SLOT_LABELS[slot].toLowerCase()}</span></span>
          ${icon('plus', 'ico-sm')}
        </button>`;
    }

    const stats = recipeStats(recipe, ingMap);
    const servings = entry.servings || 1;
    const stale = recipe.mode === 'batch' && recipe.keeps > 0
      && daysAfterCook(cookDay, dayKey) > recipe.keeps;

    return `
      <button class="meal-row" data-action="pick-meal" data-day="${dayKey}" data-slot="${slot}">
        ${icon(SLOT_ICONS[slot])}
        <span class="meal-main">
          <span class="meal-name">${escapeHtml(recipe.name)}${servings > 1 ? ` ×${servings}` : ''}</span>
          <span class="meal-sub">
            ${Math.round(stats.protein * servings)}g protein · ${Math.round(stats.kcal * servings)} kcal${stale
              ? ' · <span class="frozen">from the freezer</span>' : ''}
          </span>
        </span>
        <span class="meal-cost">${money(stats.cost * servings)}</span>
      </button>`;
  }).join('');

  return `
    <div class="card day-card">
      <div class="day-head">
        <div>
          <span class="day-name">${DAY_LABELS[dayKey]}</span>
          <span class="day-date">${date.getDate()}/${date.getMonth() + 1}</span>
          ${isCookDay ? `<span class="cook-flag">${icon('chef-hat', 'ico-sm')} Cook</span>` : ''}
        </div>
        <span class="day-meta">${Math.round(totals.protein)}g · ${money(totals.cost)}</span>
      </div>
      ${rows}
    </div>
  `;
}

// Shop

function renderShop(ctx) {
  const { plan, summary, weekStart } = ctx;

  if (!summary.lines.length) {
    return `
      ${weekNav(weekStart)}
      ${emptyState('shopping-basket', 'Nothing to buy yet',
        'Build a plan on the Week tab and the shopping list appears here.')}`;
  }

  const bought = plan.bought || {};
  const buyLines = summary.lines.filter((l) => !l.staple && !l.have);
  const stapleLines = summary.lines.filter((l) => l.staple || l.have);
  const left = outstandingTotal(summary.lines, bought);

  const groups = CATEGORIES.map((cat) => {
    const lines = buyLines.filter((l) => l.ing.category === cat.key);
    if (!lines.length) return '';
    return aisle(cat.icon, cat.label) + lines.map((l) => shopLine(l, bought)).join('');
  }).join('');

  return `
    ${weekNav(weekStart)}
    ${storageWarning()}

    ${notice(`Quantities are whole packs, because you can't buy 300g of a 500g bag.
      The leftovers are yours to keep, which is why the per-meal figure is lower than
      the till total split between meals.`)}

    ${groups}

    ${stapleLines.length ? `
      ${aisle('package', 'Cupboard staples')}
      ${notice(`Oil, spices, stock cubes and the like. Tick the ones you already have
        and they come off the total — untick when they run out.`)}
      ${stapleLines.map(stapleLine).join('')}
    ` : ''}

    <div class="total-bar">
      <span>
        <span class="micro">Left to buy</span>
        ${moneyTicket(left)}
      </span>
      <span class="side">
        <span class="micro">Full list</span>
        ${moneyTicket(summary.tillTotal)}
      </span>
    </div>

    <div class="btn-row" style="margin-top:14px">
      <button class="btn" data-action="clear-ticks">${icon('x')} Untick all</button>
      <button class="btn" data-action="copy-list">${icon('check')} Copy list</button>
    </div>
  `;
}

function aisle(iconName, label) {
  return `
    <div class="aisle">
      ${icon(iconName)}
      <span class="micro">${label}</span>
      <span class="aisle-line"></span>
    </div>`;
}

function shopLine(line, bought) {
  const done = !!bought[line.id];
  const ing = line.ing;
  const packs = line.packs > 1 ? `${line.packs} × ` : '';
  const leftoverNote = line.leftover > 0 ? ` · ${amountLabel(ing, line.leftover)} spare` : '';

  return `
    <div class="shop-line ${done ? 'done' : ''}">
      <button class="tickbox ${done ? 'on' : ''}" data-action="tick" data-id="${line.id}"
              aria-label="Tick off ${escapeHtml(ing.name)}">${icon('check', 'ico-sm')}</button>
      <div class="shop-main" data-action="edit-price" data-id="${line.id}">
        <div class="shop-name">${escapeHtml(ing.name)}${line.estimate ? '<span class="badge estimate">est</span>' : ''}</div>
        <div class="shop-sub">
          <span class="qty-chip">${packs}${amountLabel(ing, ing.packQty)}</span>
          · need ${amountLabel(ing, line.required)}${leftoverNote}
        </div>
      </div>
      <div class="shop-cost">${money(line.packCost)}</div>
    </div>`;
}

function stapleLine(line) {
  const ing = line.ing;
  return `
    <div class="shop-line ${line.have ? 'done' : ''}">
      <button class="tickbox ${line.have ? 'on' : ''}" data-action="pantry" data-id="${line.id}"
              aria-label="I already have ${escapeHtml(ing.name)}">${icon('check', 'ico-sm')}</button>
      <div class="shop-main" data-action="edit-price" data-id="${line.id}">
        <div class="shop-name">${escapeHtml(ing.name)}${line.estimate ? '<span class="badge estimate">est</span>' : ''}</div>
        <div class="shop-sub">${line.have ? 'already have it' : `need ${amountLabel(ing, line.required)} this week`}</div>
      </div>
      <div class="shop-cost">${line.have ? '—' : money(line.packCost)}</div>
    </div>`;
}

// The plain-text version for the clipboard, so the list can be pasted into
// notes, messages, or read off with the phone locked.
function shoppingText(summary, weekStart) {
  const lines = [`Shopping list — week of ${formatWeekRange(weekStart)}`, ''];
  for (const cat of CATEGORIES) {
    const items = summary.lines.filter((l) => l.ing.category === cat.key && !l.have && l.packs > 0);
    if (!items.length) continue;
    lines.push(cat.label.toUpperCase());
    for (const l of items) {
      lines.push(`  ${l.packs} × ${l.ing.name} (${amountLabel(l.ing, l.ing.packQty)})  ${money(l.packCost)}`);
    }
    lines.push('');
  }
  lines.push(`TOTAL ${money(summary.tillTotal)}`);
  return lines.join('\n');
}

function renderCook(ctx) {
  const { plan, state, ingMap, recipeMap, weekStart, summary } = ctx;

  if (!summary.meals.length) {
    return `
      ${weekNav(weekStart)}
      ${emptyState('chef-hat', 'No cook sessions yet',
        'Build a plan and the two sessions show up here, scaled to the portions you need.')}`;
  }

  const sessions = cookSessions(plan, state, recipeMap);

  return `
    ${weekNav(weekStart)}
    ${notice(`Two sessions; everything else is reheating or five minutes of assembly.
      Portions come from the plan, so cook exactly this much and nothing spare goes off
      in the fridge.`)}
    ${sessions.map((s, i) => cookSession(s, i + 1, ingMap)).join('')}
  `;
}

function cookSession(session, number, ingMap) {
  const batch = session.items.filter((i) => i.recipe.mode === 'batch');
  const fresh = session.items.filter((i) => i.recipe.mode !== 'batch');
  const covers = session.days.map((d) => DAY_SHORT[d]).join(', ');

  return `
    <div class="card">
      <div class="card-head">
        <span class="card-title">
          <span class="session-no">${number}</span>
          ${DAY_LABELS[session.cookDay]}
        </span>
        <span class="card-sub">${icon('timer', 'ico-sm')} ${session.batchMinutes} min · feeds ${covers}</span>
      </div>

      ${batch.length
        ? batch.map((item) => cookItem(item, ingMap)).join('')
        : '<div class="field-hint">Nothing to batch cook in this session.</div>'}

      ${fresh.length ? `
        ${aisle('flame', 'Cook fresh on the day')}
        ${fresh.map((item) => `
          <div class="ing-line">
            <span>${escapeHtml(item.recipe.name)}</span>
            <span class="leader"></span>
            <span class="ing-amt">${item.portions} × ${item.recipe.minutes} min</span>
          </div>`).join('')}
      ` : ''}
    </div>
  `;
}

function cookItem(item, ingMap) {
  const { recipe, portions } = item;

  const ingredients = recipe.items.map((it) => {
    const ing = ingMap.get(it.ingredient);
    if (!ing) return '';
    return `
      <div class="ing-line">
        <span>${escapeHtml(ing.name)}</span>
        <span class="leader"></span>
        <span class="ing-amt">${amountLabel(ing, it.amount * portions)}</span>
      </div>`;
  }).join('');

  const freeze = item.freezeAfter
    ? notice(`${item.freezeAfter.length} portion${item.freezeAfter.length === 1 ? '' : 's'}
        into the freezer — ${item.freezeAfter.map((d) => DAY_SHORT[d.dayKey]).join(', ')}
        ${item.freezeAfter.length === 1 ? 'is' : 'are'} past the ${recipe.keeps}-day fridge
        life. Out the night before.`, 'warn')
    : '';

  return `
    <div class="recipe-block">
      <div class="recipe-head">
        <span class="recipe-name">${escapeHtml(recipe.name)}<span class="badge batch">${portions} portion${portions === 1 ? '' : 's'}</span></span>
        <span class="card-sub">${recipe.minutes} min</span>
      </div>
      ${ingredients}
      <div style="margin-top:12px">
        ${recipe.steps.map((s, i) => `
          <div class="cook-step"><span class="num">${String(i + 1).padStart(2, '0')}</span><span>${escapeHtml(s)}</span></div>
        `).join('')}
      </div>
      ${freeze}
    </div>
  `;
}

// Prices

function renderPrices(ctx) {
  const { state, summary, priceFilter } = ctx;
  const inList = new Set(summary.lines.map((l) => l.id));
  const unconfirmed = state.ingredients.filter((i) => !i.confirmedAt).length;

  let items = state.ingredients.slice();
  if (priceFilter === 'week') items = items.filter((i) => inList.has(i.id));
  if (priceFilter === 'estimates') items = items.filter((i) => !i.confirmedAt);

  const groups = CATEGORIES.map((cat) => {
    const list = items.filter((i) => i.category === cat.key)
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!list.length) return '';
    return aisle(cat.icon, cat.label) + list.map((ing) => priceRow(ing, inList.has(ing.id))).join('');
  }).join('');

  return `
    ${storageWarning()}
    ${notice(`<strong>This is the bit only you can do.</strong> No app can read prices
      out of Inform — it's an internal staff system with no public way in, and pointing
      a script at it with your work login is a policy problem rather than a technical
      one. So: look the price up, tap the item, type it once. It stays until the price
      changes, and every total in the app follows from it.`)}

    <div class="chip-row" style="margin-bottom:14px">
      <button class="chip ${priceFilter === 'week' ? 'on' : ''}" data-action="price-filter" data-filter="week">This week's shop</button>
      <button class="chip ${priceFilter === 'estimates' ? 'on' : ''}" data-action="price-filter" data-filter="estimates">Estimates${unconfirmed ? ` (${unconfirmed})` : ''}</button>
      <button class="chip ${priceFilter === 'all' ? 'on' : ''}" data-action="price-filter" data-filter="all">Everything</button>
    </div>

    ${groups || emptyState('search', 'Nothing here', 'Try another filter.')}

    <button class="btn block" data-action="add-ingredient" style="margin-top:16px">
      ${icon('plus')} Add an item
    </button>
  `;
}

function priceRow(ing, inWeek) {
  const per = unitPrice(ing);
  const perLabel = ing.unit === 'unit' ? `${money(per)} each` : `${money(per * 100)} / 100${ing.unit}`;

  return `
    <div class="shop-line" data-action="edit-price" data-id="${ing.id}">
      <div class="shop-main">
        <div class="shop-name">
          ${escapeHtml(ing.name)}
          ${ing.confirmedAt ? '<span class="badge confirmed">yours</span>' : '<span class="badge estimate">est</span>'}
          ${inWeek ? '<span class="badge batch">this week</span>' : ''}
        </div>
        <div class="shop-sub">
          <span class="qty-chip">${amountLabel(ing, ing.packQty)}</span>
          · ${perLabel} · ${ing.protein}g protein${ing.unit === 'unit' ? ' each' : ` / 100${ing.unit}`}
        </div>
      </div>
      <div class="shop-cost">${money(ing.packPrice)}</div>
      ${icon('chevron-right', 'ico-sm')}
    </div>`;
}

function buildCtx() {
  const state = store.getState();
  const ingMap = store.ingredientMap();
  const recipeMap = store.recipeMap();
  const weekIso = isoDate(ui.weekStart);
  const plan = store.getPlan(weekIso) || { meals: {}, bought: {}, seed: 1, generatedAt: null };
  const summary = summarise(plan, recipeMap, ingMap, state.pantry);
  return {
    state, ingMap, recipeMap, weekIso, plan, summary,
    weekStart: ui.weekStart,
    priceFilter: ui.priceFilter,
  };
}

function render() {
  const ctx = buildCtx();
  applyTheme(ctx.state.settings.theme);

  const root = qs('#view-root');
  const titles = {
    week: ['calendar-days', 'This week'],
    shop: ['shopping-basket', 'Shopping list'],
    cook: ['chef-hat', 'Cook sessions'],
    prices: ['tag', 'Prices'],
    more: ['sliders-horizontal', 'Settings'],
  };
  const [titleIcon, titleText] = titles[ui.tab] || ['calendar-days', 'Meal Prep'];
  qs('#topbar-title').innerHTML = `${icon(titleIcon)}<span>${titleText}</span>`;

  if (ui.tab === 'week') root.innerHTML = renderWeek(ctx);
  else if (ui.tab === 'shop') root.innerHTML = renderShop(ctx);
  else if (ui.tab === 'cook') root.innerHTML = renderCook(ctx);
  else if (ui.tab === 'prices') root.innerHTML = renderPrices(ctx);
  else root.innerHTML = renderMore(ctx);

  for (const btn of document.querySelectorAll('.tab-btn')) {
    btn.classList.toggle('active', btn.dataset.tab === ui.tab);

  renderModal(ctx);

// Some hosts stamp data-theme on the root themselves to pass their own
// light/dark choice down. "Auto" has to mean "don't touch that", so this only
// ever clears a stamp it put there itself.
let themeStampedByApp = false;

function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === 'auto') {
    if (themeStampedByApp) {
      delete root.dataset.theme;
      themeStampedByApp = false;
    }
    return;
  }
  root.dataset.theme = theme;
  themeStampedByApp = true;
}

function toast(message) {
  const root = qs('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// ---------------------------------------------------------------------------
// Modals
// ---------------------------------------------------------------------------

function openModal(modal) {
  ui.modal = modal;
  render();
}

function closeModal() {
  stopScanner();
  ui.modal = null;
  ui.recipeDraft = null;
  ui.priceDraft = null;
  ui.foodQuery = '';
  render();
}

function renderModal(ctx) {
  const root = qs('#modal-root');
  if (!ui.modal) { root.innerHTML = ''; return; }

  let body = '';
  if (ui.modal.type === 'pick-meal') body = pickMealModal(ctx);
  else if (ui.modal.type === 'edit-price') body = editPriceModal(ctx);
  else if (ui.modal.type === 'recipes') body = recipeListModal(ctx);
  else if (ui.modal.type === 'recipe-edit') body = recipeEditModal(ctx);
  else if (ui.modal.type === 'food-search') body = foodSearchModal(ctx);
  else if (ui.modal.type === 'barcode') body = barcodeModal(ctx);
  else if (ui.modal.type === 'text') body = textModal(ctx);

  root.innerHTML = `<div class="modal-backdrop" data-action="close-modal"><div class="modal" data-stop>${body}</div></div>`;
}

function pickMealModal(ctx) {
  const { slot, day } = ui.modal;
  const { ingMap, plan } = ctx;
  const current = ((plan.meals || {})[day] || {})[slot];

  const options = store.recipesForSlot(slot)
    .map((r) => ({ r, stats: recipeStats(r, ingMap), ppp: proteinPerPound(r, ingMap) }))
    .sort((a, b) => b.ppp - a.ppp);

  return `
    <div class="modal-title">${SLOT_LABELS[slot]} — ${day[0].toUpperCase() + day.slice(1)}</div>
    <div class="field-hint" style="margin-bottom:10px">Sorted by protein per pound, best value first.</div>
    ${options.map(({ r, stats }) => `
      <button class="option-row ${current && current.recipe === r.id ? 'on' : ''}" data-action="set-meal" data-recipe="${r.id}">
        <div class="option-main">
          <div class="option-name">${escapeHtml(r.name)}<span class="badge ${r.mode === 'batch' ? 'batch' : 'fresh'}">${r.mode === 'batch' ? 'batch' : 'fresh'}</span></div>
          <div class="option-sub">${Math.round(stats.protein)}g protein · ${Math.round(stats.kcal)} kcal · ${r.minutes} min</div>
        </div>
        <div class="shop-cost">${money(stats.cost)}</div>
      </button>
    `).join('')}
    <div class="btn-row" style="margin-top:12px">
      ${current ? '<button class="btn danger" data-action="clear-meal">Remove</button>' : ''}
      <button class="btn" data-action="close-modal">Close</button>
    </div>
  `;
}

    <div class="btn-row" style="margin-top:12px">

      <button class="btn" data-action="close-modal">Close</button>

// Search the bundled food table. No network — this works everywhere, including
// inside Claude where outside requests are blocked.
function foodSearchModal() {
  const results = searchFoods(ui.foodQuery, 40);

  return `
    <div class="modal-title">Fill from food list</div>
    <div class="field">
      <input id="food-query" type="search" placeholder="chicken, oats, yoghurt…"
             value="${escapeHtml(ui.foodQuery)}" data-action="food-query" autocomplete="off" />
      <div class="field-hint">
        Typical values for the food, not a specific brand. Fills the nutrition and
        a common pack size — check both against the packet, and type the price.
      </div>
    </div>
    ${results.length ? results.map((food, i) => `
      <button class="option-row" data-action="pick-food" data-index="${i}">
        <div class="option-main">
          <div class="option-name">${escapeHtml(food.name)}</div>
          <div class="option-sub">
            ${food.protein}g protein · ${food.kcal} kcal
            ${food.unit === 'unit' ? 'each' : `per 100${food.unit}`}
            ${food.pack ? ` · usually ${food.pack}${food.unit === 'unit' ? ' ' + food.unitNoun + 's' : food.unit}` : ''}
          </div>
        </div>
      </button>
